<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST</title>
    <link rel="stylesheet" href="./css/index.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="wrapper flex items-center flex-col">
        <div class="serach-box border-2 rounded-3xl md:w-96 w-72 flex items-center justify-between h-12 rounded pl-4">
            <input class="w-3/4 text-xl h-full outline-none" id="input" type="text" placeholder="Add Task">
            <i class="addtask w-1/5 cursor-pointer bg-red-500 rounded-3xl text-white h-full items-center flex justify-center fa-solid fa-paper-plane"></i>
        </div>

        <div class="task-status flex justify-center gap-3 mt-4">
            <button class="all md:w-28 w-24 p-2 text-sm md:text-base text-white rounded-3xl bg-gray-500">All</button>
            <button class="active md:w-28 w-24 p-2 text-sm md:text-base text-white rounded-3xl bg-blue-500">Active</button>
            <button class="completed md:w-28 w-24 p-2 text-sm md:text-base text-white rounded-3xl bg-red-500">Completed</button>
        </div>

        <div class="task-container w-full mt-4">
            
        </div>
    </div>

    <script type="module" src="./scripts/features/controller/controller.js"></script>
</body>
</html>
